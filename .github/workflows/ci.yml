name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/devflow
      AUTH_SECRET: ci-only-placeholder-secret-that-is-never-used-in-production
      AUTH_GITHUB_ID: ci-github-client-id
      AUTH_GITHUB_SECRET: ci-github-client-secret
      AUTH_GOOGLE_ID: ci-google-client-id
      AUTH_GOOGLE_SECRET: ci-google-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.mjs', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Check Week 4 AI workflow
        run: pnpm check:week4

      - name: Check Week 5-6 browser sandbox
        run: pnpm check:week56

      - name: Check Week 7 recommendation and cursor logic
        run: pnpm check:week7

      - name: Check Week 3 search terms
        run: pnpm check:week3-search

      - name: Check MongoDB
        run: pnpm health

      - name: Verify demo seed is repeatable
        env:
          DEMO_USER_PASSWORD: "CI-only-Demo-Password-123!"
        run: |
          pnpm seed
          pnpm seed

      - name: Verify Week 2 data migration
        run: pnpm migrate:week2 --apply

      - name: Verify Week 3 search indexes
        run: pnpm migrate:week3 --apply

      - name: Verify Week 7 feed indexes and view deduplication
        run: |
          pnpm migrate:week7 --apply
          pnpm migrate:week7

      - name: Build
        run: pnpm build
